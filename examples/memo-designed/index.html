<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오늘 할 일</title>
<style>
  :root {
    --bg: #F0FDFA; --ink: #134E4A; --muted: #4B6E6A; --line: #C9E6E0;
    --primary: #0F766E; --on-primary: #FFFFFF; --field: #FFFFFF; --danger: #B91C1C;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0B1D1C; --ink: #D5F0EC; --muted: #8DB3AE; --line: #1F3B39;
      --primary: #2DD4BF; --on-primary: #06201E; --field: #10292A; --danger: #F87171;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", "Malgun Gothic", system-ui, sans-serif;
    display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }
  .wrap { width: min(640px, 100% - 48px); margin: 0 auto; }

  header { padding: 40px 0 0; user-select: none; }
  .date {
    margin: 0; font-family: "Segoe UI Variable Display", "Segoe UI", "Malgun Gothic", sans-serif;
    font-size: 44px; line-height: 1.1; font-weight: 700; letter-spacing: -0.02em;
  }
  .progress { margin: 20px 0 0; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress > div { height: 100%; width: 0; background: var(--primary); transition: width 240ms ease-out; }
  #status { margin: 8px 0 0; min-height: 1.5em; font-size: 13px; color: var(--muted); }

  form { display: flex; gap: 8px; margin: 24px 0 8px; }
  #text {
    flex: 1; min-width: 0; height: 44px; padding: 0 14px; font: inherit; color: var(--ink);
    background: var(--field); border: 1px solid var(--line); border-radius: 8px; user-select: text;
  }
  #text::placeholder { color: var(--muted); }
  .add {
    height: 44px; padding: 0 20px; font: inherit; font-weight: 600; cursor: pointer;
    color: var(--on-primary); background: var(--primary); border: 0; border-radius: 8px;
  }
  .add:hover { filter: brightness(1.08); }
  :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  main { overflow-y: auto; padding-bottom: 32px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li { display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--line); }
  li input { width: 20px; height: 20px; margin: 0; accent-color: var(--primary); cursor: pointer; flex: none; }
  li label { flex: 1; cursor: pointer; }
  li.done label { color: var(--muted); text-decoration: line-through; }
  .del {
    width: 36px; height: 36px; flex: none; display: grid; place-items: center; cursor: pointer;
    color: var(--muted); background: none; border: 0; border-radius: 6px;
  }
  .del:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 10%, transparent); }
  .empty { padding: 32px 0; color: var(--muted); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  @media (prefers-reduced-motion: reduce) { .progress > div { transition: none; } }
</style>
</head>
<body>
<header class="wrap">
  <h1 class="date" id="date"></h1>
  <div class="progress" aria-hidden="true"><div id="bar"></div></div>
  <p id="status" aria-live="polite"></p>
  <form id="add">
    <label class="sr-only" for="text">새 할 일</label>
    <input id="text" placeholder="할 일을 적고 Enter" autocomplete="off" required>
    <button class="add">추가</button>
  </form>
</header>
<main class="wrap">
  <ul id="list"></ul>
</main>
<script>
  // 빌드된 앱에서는 %APPDATA%\<앱>\todos.json 에 저장, 브라우저로 열면 메모리에만 둔다.
  const api = window.go?.main?.App;
  let todos = [];

  document.getElementById('date').textContent =
    new Date().toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });

  const trash = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>';

  function render() {
    const list = document.getElementById('list');
    list.innerHTML = '';
    if (!todos.length) {
      list.innerHTML = '<li class="empty">할 일이 없습니다. 위 입력란에 첫 할 일을 적어 보세요.</li>';
    }
    todos.forEach((t, i) => {
      const li = document.createElement('li');
      li.className = t.done ? 'done' : '';
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.id = 'todo-' + i;
      box.checked = t.done;
      box.onchange = () => { t.done = box.checked; save(); };
      const label = document.createElement('label');
      label.htmlFor = box.id;
      label.textContent = t.text;
      const del = document.createElement('button');
      del.className = 'del';
      del.innerHTML = trash;
      del.setAttribute('aria-label', `"${t.text}" 삭제`);
      del.title = '삭제';
      del.onclick = () => { todos.splice(i, 1); save(); };
      li.append(box, label, del);
      list.append(li);
    });
    const done = todos.filter(t => t.done).length;
    document.getElementById('bar').style.width = todos.length ? `${done / todos.length * 100}%` : '0';
    document.getElementById('status').textContent = !todos.length ? ''
      : done === todos.length ? `${todos.length}개 모두 끝냈습니다.`
      : `${todos.length}개 중 ${done}개 완료`;
  }

  async function save() {
    render();
    if (api) await api.SaveText('todos.json', JSON.stringify(todos));
  }

  document.getElementById('add').onsubmit = (e) => {
    e.preventDefault();
    const input = document.getElementById('text');
    const text = input.value.trim();
    if (!text) return;
    todos.push({ text, done: false });
    input.value = '';
    save();
  };

  (async () => {
    if (api) todos = JSON.parse((await api.LoadText('todos.json')) || '[]');
    render();
  })();
</script>
</body>
</html>
